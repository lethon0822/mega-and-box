constants:
  jwt:
    issuer: ${JWT_ISS} #토큰 발행자
    bearer-format: JWT

    claim-key: signedUser
    secret-key: ${JWT_KEY}

    access-token-cookie-name: access-token
    access-token-cookie-path: / #모든 경로에서 access-token값이 넘어온다.
    access-token-cookie-validity-seconds: 900 # 15분 (s) 60 * 15
    access-token-validity-milliseconds: 900_000 # 15분 (ms) 60 * 15 * 1000

    refresh-token-cookie-name: refresh-token
    refresh-token-cookie-path: ${RT_PATH} #해당 path때만 refresh-token값이 넘어온다.
    refresh-token-cookie-validity-seconds: 1_296_000 # 15일 (s) 60 * 60 * 24 * 15
    refresh-token-validity-milliseconds: 1_296_000_000 # 15일 (ms) 60 * 60 * 24 * 15 * 1000


spring:
  application:
    name: cinema

  # DataSource
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA & Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        format_sql: true
        order_updates: true
        show_sql: true

  # MyBatis
  mybatis:
    mapper-locations: classpath:mapper/**/*.xml
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
      map-underscore-to-camel-case: true
      default-statement-timeout: 10

  # Swagger (springdoc-openapi)
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      groups-order: DESC
      operations-sorter: method
      disable-swagger-default-url: true
      display-request-duration: true
    api-docs:
      path: /v3/api-docs

  logging:
    level:
      root: INFO
      com.rainbowuniv: DEBUG
      org.mybatis: DEBUG
      jdbc.sqlonly: DEBUG
      jdbc.sqltiming: INFO
      jdbc.audit: OFF
      jdbc.resultset: OFF
      jdbc.connection: OFF